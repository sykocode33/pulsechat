services:
  # ─── PostgreSQL ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsechat
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsechat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pulsechat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible storage) ────────
  minio:
    image: minio/minio:latest
    container_name: pulsechat-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: pulsechat_minio
      MINIO_ROOT_PASSWORD: pulsechat_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Nginx Reverse Proxy ─────────────────
  nginx:
    image: nginx:alpine
    container_name: pulsechat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres-data:
  redis-data:
  minio-data:
